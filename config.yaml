region:
  # A name from weather_pipeline.constants.REGION_PRESETS, or null.
  name: france
  
  # Bounding box [lat_min, lat_max, lon_min, lon_max], with lon in -180..180.
  # Note: Overrides `name` when set. 
  # Note: Must cover the target grid plus a margin.
  box: null

paths:
  target: data/cerra            # downloaded high-resolution target for downscaler training
  pairs: data/pairs             # coarse - fine training pairs for downscaler training
  runs: runs                    # trained models and reports
  forecasts: outputs/forecasts  # coarse ensemble forecasts, on which the downscaler will be applied
  downscaled: outputs/downscaled
  evaluation: outputs/eval
  stations_cache: outputs/cache/stations

target:
  dataset: reanalysis-cerra-single-levels # Name of the high resolution reanalysis used as the training target from Copernicus (url: https://cds.climate.copernicus.eu/api)
  cds_workers: 2                          # concurrent Copernicus requests; keep small
  variable: 2m_temperature
  static_variables: [orography, land_sea_mask]
  years: [2014, 2020]           
  train_years: [2014, 2019]     
  times: ["00:00", "06:00", "12:00", "18:00"]


coarse:
  source: era5
  variable: t2m
  fetch_batch: 28               # time steps per request

stations:
  provider: meteofrance_hourly
  variables: [t2m]
  min_completeness: 0.9         # fraction of hours a station must report
  holdout_frac: 0.2             # stations reserved for testing
  active: full                  # "full": active over the whole window, or "overlap"
  include_unknown_start: false
  window: null                  # [start, end] override, else derived from the forecasts

training:
  loss: crps                    # "crps" for an ensemble, "mse" for a single map
  members: 4                    # members per input during training
  eval_members: 8
  epochs: 20
  batch_size: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  base_channels: 32
  depth: 3
  noise_channels: 4
  seed: 0
  max_steps_per_epoch: null     

inference:
  samples: 4                    # downscaled maps per coarse ensemble member
  batch_size: 8

evaluation:
  heat_thresholds_c: [30.0, 35.0]
  elevation_edges: [0, 200, 500, 1000, 1500, 2500, 5000]
  n_bootstrap: 200
  bootstrap_block: 2            # consecutive initialisations resampled together
  density_alpha_deg: 0.75       # station density weighting; null disables it
  lead_hours_shown: [6, 24, 48, 96, 240]