[project]
name = "weather-forecast-model-downscaler"
version = "0.1.0"
description = "Train a downscaler on ERA5/CERRA and apply it to AIFS-ENS forecasts from Earthmover"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "zarr",
    "scipy",
    "dask",
    "pyyaml",
    "torch",
    # Coarse inputs: ERA5 for training and AIFS-ENS forecasts, both read from Earthmover.
    "arraylake",
    "pcodec",  # zarr codec the Arraylake ERA5 repo is compressed with
    # Published datasets and models on the Hugging Face Hub (fsspec "hf://" paths included).
    "huggingface_hub",
    # Station observations from Météo-France.
    "wetterdienst==0.141.0",  # later releases rename the parameters downscale/stations.py requests
    # Target download from the Copernicus Climate Data Store; GRIB decoding needs ecCodes.
    "cdsapi",
    "cfgrib",
    "eccodes>=2.38",
    "eccodeslib",
    # Station scoring. Not published to PyPI, so it comes from git via [tool.uv.sources].
    "weatherbenchX",
    "matplotlib",
    "cartopy",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["downscale"]

[tool.uv.sources]
weatherbenchX = { git = "https://github.com/google-research/weatherbenchX.git" }

[dependency-groups]
dev = ["pytest"]
